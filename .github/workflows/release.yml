name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to build and upload assets for
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS ${{ matrix.arch }} release assets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            build_script: build:mac:arm64:release
            verify_script: verify:mac:arm64:release
          - arch: x64
            runner: macos-15-intel
            build_script: build:mac:intel:release
            verify_script: verify:mac:intel:release

    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = [
              "APPLE_API_KEY_BASE64",
              "APPLE_API_KEY_ID",
              "APPLE_API_ISSUER",
              "MAC_CSC_LINK",
              "MAC_CSC_KEY_PASSWORD",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required secrets: {', '.join(missing)}")

          key_id = os.environ["APPLE_API_KEY_ID"]
          key_data = base64.b64decode(os.environ["APPLE_API_KEY_BASE64"], validate=True)
          key_path = Path(os.environ["RUNNER_TEMP"]) / f"AuthKey_{key_id}.p8"
          key_path.write_bytes(key_data)
          key_path.chmod(0o600)

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"APPLE_API_KEY={key_path}\n")
          PY

      - name: Build signed and notarized macOS app
        run: npm run ${{ matrix.build_script }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify signed and notarized macOS artifacts
        run: npm run ${{ matrix.verify_script }}

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/*${{ matrix.arch }}*.dmg dist/*${{ matrix.arch }}*.zip)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No macOS ${{ matrix.arch }} release assets found in dist/." >&2
            exit 1
          fi

          gh release upload "$TAG_NAME" "${assets[@]}" --clobber

  windows:
    name: Build Windows x64 release assets
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 app
        run: npm run build:win

      - name: Upload assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/*.exe)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No Windows release assets found in dist/." >&2
            exit 1
          fi

          gh release upload "$TAG_NAME" "${assets[@]}" --clobber

  linux:
    name: Build Linux x64 release assets
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux x64 app
        run: npm run build:linux:release

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/*.AppImage dist/*.deb)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No Linux release assets found in dist/." >&2
            exit 1
          fi

          gh release upload "$TAG_NAME" "${assets[@]}" --clobber
